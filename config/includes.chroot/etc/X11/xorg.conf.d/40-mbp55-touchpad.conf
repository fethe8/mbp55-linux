# MacBookPro5,5 has a buttonless (click-anywhere) bcm5974 trackpad.
Section "InputClass"
	Identifier "mbp55 touchpad"
	MatchIsTouchpad "on"
	MatchDriver "libinput"
	Option "Tapping" "on"
	Option "ClickMethod" "clickfinger"
	Option "DisableWhileTyping" "on"
	Option "NaturalScrolling" "off"
EndSection
